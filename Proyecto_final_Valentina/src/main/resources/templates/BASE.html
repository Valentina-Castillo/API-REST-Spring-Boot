<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Coches.eus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        if (!localStorage.getItem('jwtToken')) {
            window.location.href = '/login';
        }
    </script>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/dashboard}">🏎️ COCHES.EUS</a>
            <div>
                <a href="/marcas" class="btn btn-outline-light btn-sm me-2">🏷️ Marcas</a>
                <a href="/coches" class="btn btn-outline-light btn-sm me-2">🚗 Coches</a>
                <button class="btn btn-danger btn-sm" onclick="logout()">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div id="alertaZona"></div>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white" id="formTitulo">Añadir Nuevo Coche</div>
            <div class="card-body">
                <input type="hidden" id="cocheId">
                <div class="row g-3 align-items-end">
                    <div class="col"><input type="text"   id="nuevoModelo"    class="form-control" placeholder="Modelo"></div>
                    <div class="col"><input type="text"   id="nuevaMatricula" class="form-control" placeholder="Matrícula"></div>
                    <div class="col"><input type="number" id="nuevoPrecio"    class="form-control" placeholder="Precio (€)"></div>
                    <div class="col"><input type="number" id="nuevaPotencia"  class="form-control" placeholder="Potencia (CV)"></div>
                    <div class="col">
                        <select id="nuevaMarcaId" class="form-select">
                            <option value="">-- Selecciona Marca --</option>
                        </select>
                    </div>
                    <div class="col-auto d-flex gap-2">
                        <button class="btn btn-success" onclick="guardarCoche()">Guardar</button>
                        <button class="btn btn-secondary d-none" id="btnCancelar" onclick="limpiarFormulario()">Cancelar</button>
                    </div>
                </div>
            </div>
        </div>

        <h2 class="mb-3">Listado de Coches</h2>
        <table class="table table-striped table-hover border">
            <thead class="table-dark">
                <tr><th>ID</th><th>Modelo</th><th>Matrícula</th><th>Precio</th><th>Potencia</th><th>Marca</th><th>Acciones</th></tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>

    <script>
        const token = localStorage.getItem('jwtToken');
        const headers = { 'Authorization': 'Bearer ' + token };

        async function cargarMarcasSelect() {
            try {
                const res = await fetch('/api/v1/marcas/', { headers });
                if (!res.ok || res.status === 204) return;
                const marcas = await res.json();
                const sel = document.getElementById('nuevaMarcaId');
                while (sel.options.length > 1) sel.remove(1);
                marcas.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.id;
                    opt.text  = m.nombre;
                    sel.appendChild(opt);
                });
            } catch (e) { console.error('Error cargando marcas:', e); }
        }

        async function cargarCoches() {
            try {
                const res = await fetch('/api/v1/coches', { headers });
                if (res.status === 204) {
                    document.getElementById('cuerpoTabla').innerHTML =
                        '<tr><td colspan="7" class="text-center text-muted">No hay coches registrados</td></tr>';
                    return;
                }
                if (!res.ok) return;
                const coches = await res.json();
                const cuerpo = document.getElementById('cuerpoTabla');
                cuerpo.innerHTML = '';
                coches.forEach(c => {
                    const marcaNombre = c.marca ? c.marca.nombre : '—';
                    const marcaId     = c.marca ? c.marca.id     : '';
                    cuerpo.innerHTML += `<tr>
                        <td>${c.id}</td>
                        <td>${c.modelo}</td>
                        <td>${c.matricula}</td>
                        <td>${c.precio != null ? c.precio + ' €' : '—'}</td>
                        <td>${c.potencia != null ? c.potencia + ' CV' : '—'}</td>
                        <td>${marcaNombre}</td>
                        <td>
                            <button class="btn btn-warning btn-sm me-1"
                                onclick="cargarEnFormulario(${c.id}, '${(c.modelo||'').replace(/'/g,"\\'")}', '${(c.matricula||'').replace(/'/g,"\\'")}', ${c.precio||0}, ${c.potencia||0}, ${marcaId||0})">
                                Modificar
                            </button>
                            <button class="btn btn-danger btn-sm" onclick="borrar(${c.id})">Borrar</button>
                        </td>
                    </tr>`;
                });
            } catch (e) { console.error('Error cargando coches:', e); }
        }

        function cargarEnFormulario(id, modelo, matricula, precio, potencia, marcaId) {
            document.getElementById('cocheId').value        = id;
            document.getElementById('nuevoModelo').value    = modelo;
            document.getElementById('nuevaMatricula').value = matricula;
            document.getElementById('nuevoPrecio').value    = precio;
            document.getElementById('nuevaPotencia').value  = potencia || '';
            document.getElementById('nuevaMarcaId').value   = marcaId  || '';
            document.getElementById('formTitulo').innerText = '✏️ Editando Coche ID: ' + id;
            document.getElementById('btnCancelar').classList.remove('d-none');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function limpiarFormulario() {
            document.getElementById('cocheId').value        = '';
            document.getElementById('nuevoModelo').value    = '';
            document.getElementById('nuevaMatricula').value = '';
            document.getElementById('nuevoPrecio').value    = '';
            document.getElementById('nuevaPotencia').value  = '';
            document.getElementById('nuevaMarcaId').value   = '';
            document.getElementById('formTitulo').innerText = 'Añadir Nuevo Coche';
            document.getElementById('btnCancelar').classList.add('d-none');
        }

        async function guardarCoche() {
            const id        = document.getElementById('cocheId').value;
            const modelo    = document.getElementById('nuevoModelo').value.trim();
            const matricula = document.getElementById('nuevaMatricula').value.trim();
            const precio    = parseFloat(document.getElementById('nuevoPrecio').value);
            const potencia  = parseInt(document.getElementById('nuevaPotencia').value) || null;
            const marcaId   = parseInt(document.getElementById('nuevaMarcaId').value) || null;

            if (!modelo || !matricula || isNaN(precio)) {
                alerta('Modelo, matrícula y precio son obligatorios', 'warning'); return;
            }

            const body = { modelo, matricula, precio, potencia };
            if (marcaId) body.marca = { id: marcaId };

            const url    = id ? '/api/v1/coches/' + id : '/api/v1/coches';
            const metodo = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: metodo,
                    headers: { ...headers, 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (res.ok || res.status === 201) {
                    alerta(id ? 'Coche modificado ✅' : 'Coche añadido ✅', 'success');
                    limpiarFormulario();
                    cargarCoches();
                } else {
                    alerta('Error al guardar (código: ' + res.status + ')', 'danger');
                }
            } catch (e) { alerta('Error de conexión', 'danger'); }
        }

        async function borrar(id) {
            if (!confirm('¿Seguro que deseas eliminar el coche con ID ' + id + '?')) return;
            try {
                const res = await fetch('/api/v1/coches/' + id, { method: 'DELETE', headers });
                if (res.ok) {
                    alerta('Coche eliminado ✅', 'success');
                    cargarCoches();
                } else if (res.status === 404) {
                    alerta('Coche no encontrado', 'warning');
                } else {
                    alerta('Error al borrar (código: ' + res.status + ')', 'danger');
                }
            } catch (e) { alerta('Error de conexión', 'danger'); }
        }

        function alerta(msg, tipo) {
            const zona = document.getElementById('alertaZona');
            zona.innerHTML = `<div class="alert alert-${tipo} alert-dismissible fade show" role="alert">
                ${msg}
                <button type="button" class="btn-close" onclick="this.parentElement.remove()"></button>
            </div>`;
            setTimeout(() => zona.innerHTML = '', 4000);
        }

        function logout() {
            localStorage.removeItem('jwtToken');
            localStorage.removeItem('username');
            window.location.href = '/login';
        }

        cargarMarcasSelect();
        cargarCoches();
    </script>
</body>
</html>
