<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Marcas - Coches.eus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        if (!localStorage.getItem('jwtToken')) {
            window.location.href = '/login';
        }
    </script>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/dashboard}">🏎️ COCHES.EUS</a>
            <div>
                <a href="/marcas" class="btn btn-outline-light btn-sm me-2">🏷️ Marcas</a>
                <a href="/coches" class="btn btn-outline-light btn-sm me-2">🚗 Coches</a>
                <a href="/dashboard" class="btn btn-outline-light btn-sm me-2">🏠 Dashboard</a>
                <button class="btn btn-danger btn-sm" onclick="logout()">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div id="alertaZona"></div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="text-primary">🏷️ Administración de Marcas</h1>
        </div>

        <div class="row">
            <!-- Formulario izquierda -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="card-title mb-0" id="form-title">Nueva Marca</h4>
                    </div>
                    <div class="card-body">
                        <div id="marcaForm">
                            <input type="hidden" id="marcaId">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre de la Marca</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Ej: Ferrari">
                            </div>
                            <div class="d-grid gap-2">
                                <button class="btn btn-success" onclick="guardarMarca()">Guardar</button>
                                <button class="btn btn-secondary d-none" id="btnCancelar" onclick="limpiarFormulario()">Cancelar Edición</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabla derecha -->
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <table class="table table-striped table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th style="width:15%">ID</th>
                                    <th>Nombre</th>
                                    <th style="width:25%" class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaMarcasBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('jwtToken');
        const headers = { 'Authorization': 'Bearer ' + token };
        const API_URL = '/api/v1/marcas/';

        // 1. GET: Listar marcas
        async function listarMarcas() {
            try {
                const res = await fetch(API_URL, { headers });
                const tbody = document.getElementById('tablaMarcasBody');
                if (res.status === 204) {
                    tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">No hay marcas registradas</td></tr>';
                    return;
                }
                if (!res.ok) { alerta('Error al cargar marcas (código: ' + res.status + ')', 'danger'); return; }
                const marcas = await res.json();
                tbody.innerHTML = '';
                marcas.forEach(marca => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${marca.id}</td>
                            <td><strong>${marca.nombre}</strong></td>
                            <td class="text-center">
                                <button class="btn btn-warning btn-sm me-1" onclick="cargarEnFormulario(${marca.id}, '${marca.nombre.replace(/'/g, "\\'")}')">Editar</button>
                                <button class="btn btn-danger btn-sm" onclick="eliminarMarca(${marca.id})">Borrar</button>
                            </td>
                        </tr>`;
                });
            } catch (e) { alerta('Error de conexión', 'danger'); }
        }

        // 2. POST / PUT: Guardar o Modificar
        async function guardarMarca() {
            const id     = document.getElementById('marcaId').value;
            const nombre = document.getElementById('nombre').value.trim();

            if (!nombre) { alerta('El nombre es obligatorio', 'warning'); return; }

            const marcaData = { nombre };
            let metodo = 'POST';
            let url    = API_URL;

            if (id) {
                marcaData.id = parseInt(id);
                metodo = 'PUT';
                // PUT acepta el id en el body (MarcaAPI usa PUT /)
                url = API_URL;
            }

            try {
                const res = await fetch(url, {
                    method: metodo,
                    headers: { ...headers, 'Content-Type': 'application/json' },
                    body: JSON.stringify(marcaData)
                });
                if (res.ok || res.status === 201) {
                    alerta(id ? 'Marca modificada ✅' : 'Marca añadida ✅', 'success');
                    limpiarFormulario();
                    listarMarcas();
                } else {
                    alerta('Error al guardar (código: ' + res.status + ')', 'danger');
                }
            } catch (e) { alerta('Error de conexión', 'danger'); }
        }

        // 3. DELETE: Eliminar marca
        async function eliminarMarca(id) {
            if (!confirm('¿Estás segura de eliminar esta marca?')) return;
            try {
                const res = await fetch(API_URL + id, {
                    method: 'DELETE',
                    headers
                });
                if (res.ok) {
                    alerta('Marca eliminada ✅', 'success');
                    listarMarcas();
                } else if (res.status === 404) {
                    alerta('Marca no encontrada', 'warning');
                } else {
                    alerta('Error al borrar (código: ' + res.status + ')', 'danger');
                }
            } catch (e) { alerta('Error de conexión', 'danger'); }
        }

        // Utilidades UI
        function cargarEnFormulario(id, nombre) {
            document.getElementById('marcaId').value = id;
            document.getElementById('nombre').value  = nombre;
            document.getElementById('form-title').innerText = 'Editar Marca';
            document.getElementById('btnCancelar').classList.remove('d-none');
        }

        function limpiarFormulario() {
            document.getElementById('marcaId').value = '';
            document.getElementById('nombre').value  = '';
            document.getElementById('form-title').innerText = 'Nueva Marca';
            document.getElementById('btnCancelar').classList.add('d-none');
        }

        function alerta(msg, tipo) {
            const zona = document.getElementById('alertaZona');
            zona.innerHTML = `<div class="alert alert-${tipo} alert-dismissible fade show" role="alert">
                ${msg}
                <button type="button" class="btn-close" onclick="this.parentElement.remove()"></button>
            </div>`;
            setTimeout(() => zona.innerHTML = '', 4000);
        }

        function logout() {
            localStorage.removeItem('jwtToken');
            localStorage.removeItem('username');
            window.location.href = '/login';
        }

        listarMarcas();
    </script>
</body>
</html>
